[preset.0]
name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features="offline-mobile,no-webrtc"
export_filter="all_resources"
include_filter="data/*.json,data/**/*.json,assets/**/*.json"
exclude_filter="addons/*,gdre_export.log,*.binary,*.gdc,mobile_smoke.gd,national_runtime_test.gd,national_battle_smoke.gd"
export_path="../build/apk/pokemon-prototype-mobile.apk"
script_export_mode=2

[preset.0.options]
custom_template/debug="../tools/templates/android_debug.apk"
custom_template/release="../tools/templates/android_release.apk"
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=6
version/name="0.2.0-national"
package/unique_name="com.emerald.offline"
package/name="Pokémon Prototype Mobile"
package/signed=true
keystore/debug="../build/debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=false
permissions/access_network_state=false
user_data_backup/allow=false

[preset.1]
name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features="offline-mobile,no-webrtc"
export_filter="all_resources"
include_filter="data/*.json,data/**/*.json,assets/**/*.json"
exclude_filter="addons/*,gdre_export.log,*.binary,*.gdc,mobile_smoke.gd,national_runtime_test.gd,national_battle_smoke.gd"
export_path="../public/game/index.html"
script_export_mode=2

[preset.1.options]
custom_template/debug="../tools/templates/web_nothreads_debug.zip"
custom_template/release="../tools/templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
